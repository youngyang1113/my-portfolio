<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>留言板 · Contact & Comments</title>
  <meta name="description" content="公开留言板，欢迎留下想法与反馈。" />
  <style>
    :root {
      --bg: #0c0e14;
      --panel: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.1);
      --text: #e8eaef;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --accent2: #818cf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    .page-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(56, 189, 248, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 100% 50%, rgba(129, 140, 248, 0.1), transparent),
        var(--bg);
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 3rem 1.25rem 4rem;
    }

    header { text-align: center; margin-bottom: 2.5rem; }

    .eyebrow {
      font-family: ui-monospace, monospace;
      font-size: 0.75rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .subtitle { color: var(--muted); font-size: 1.05rem; max-width: 28rem; margin: 0 auto; }

    .guestbook {
      position: relative;
      border-radius: 1.25rem;
      border: 1px solid var(--border);
      background: linear-gradient(145deg, rgba(255,255,255,0.09), rgba(56,189,248,0.06));
      padding: 1.5rem 1.25rem 2rem;
      box-shadow: 0 24px 48px -24px rgba(0,0,0,0.5);
    }

    .guestbook h2 {
      font-size: 1.125rem;
      margin-bottom: 0.35rem;
    }

    .guestbook .hint {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .setup-notice {
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
      font-size: 0.875rem;
      color: #fde68a;
      margin-bottom: 1rem;
    }

    .setup-notice code {
      background: rgba(0,0,0,0.3);
      padding: 0.1rem 0.35rem;
      border-radius: 0.25rem;
      font-size: 0.8rem;
    }

    footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.75rem;
      color: var(--muted);
    }

    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>
  <div class="wrap">
    <header>
      <p class="eyebrow">Contact &amp; Comments</p>
      <h1>留言板</h1>
      <p class="subtitle">欢迎留言与反馈。留言公开可见，最新在上，提交后自动刷新。</p>
    </header>

    <section class="guestbook" aria-labelledby="gb-title">
      <h2 id="gb-title">写下你的留言</h2>
      <p class="hint">需使用 GitHub 账号登录后发表（由 Giscus 提供，数据保存在仓库 Discussions）。</p>

      <!-- 未配置时显示；配置 Giscus 后删除此块 -->
      <div class="setup-notice" id="setup-notice">
        请在本文件底部 <code>&lt;script&gt;</code> 中填写 <code>data-repo</code>、<code>data-repo-id</code>、
        <code>data-category-id</code>（在 <a href="https://giscus.app/zh-CN" style="color:#7dd3fc">giscus.app</a> 生成），
        并确保仓库已开启 Discussions。
      </div>

      <section id="giscus-root" aria-label="评论区"></section>
    </section>

    <footer>
      Powered by <a href="https://giscus.app/zh-CN" target="_blank" rel="noopener">Giscus</a>
      · 可部署到 GitHub Pages
    </footer>
  </div>

  <!--
    ========== Giscus 配置步骤 ==========
    1. 打开 https://giscus.app/zh-CN
    2. 选择你的公开 GitHub 仓库，开启 Discussions
    3. 安装 giscus GitHub App
    4. 复制生成的 script 属性，替换下方 REPLACE_* 占位符
    5. 删除 id="setup-notice" 的提示 div
  -->
  <script>
    (function () {
      var REPO = 'REPLACE_OWNER/REPLACE_REPO';
      var REPO_ID = 'REPLACE_REPO_ID';
      var CATEGORY_ID = 'REPLACE_CATEGORY_ID';

      if (REPO.indexOf('REPLACE_') !== -1) return;

      document.getElementById('setup-notice')?.remove();

      var s = document.createElement('script');
      s.src = 'https://giscus.app/client.js';
      s.setAttribute('data-repo', REPO);
      s.setAttribute('data-repo-id', REPO_ID);
      s.setAttribute('data-category', 'Announcements');
      s.setAttribute('data-category-id', CATEGORY_ID);
      s.setAttribute('data-mapping', 'pathname');
      s.setAttribute('data-strict', '0');
      s.setAttribute('data-reactions-enabled', '1');
      s.setAttribute('data-emit-metadata', '0');
      s.setAttribute('data-input-position', 'top');
      s.setAttribute('data-theme', 'dark');
      s.setAttribute('data-lang', 'zh-CN');
      s.setAttribute('data-loading', 'lazy');
      s.crossOrigin = 'anonymous';
      s.async = true;
      document.getElementById('giscus-root').appendChild(s);
    })();
  </script>

  <!--
    ========== 备选：Utterances（使用 GitHub Issues）==========
    <script src="https://utteranc.es/client.js"
      repo="OWNER/REPO"
      issue-term="pathname"
      theme="github-dark"
      crossorigin="anonymous"
      async>
    </script>
  -->
</body>
</html>
